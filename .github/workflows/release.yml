name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Skip release-please and just publish to npm from main HEAD"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Surface release-please outputs to the binaries job below so it can decide
    # whether a release was actually cut and which tag to build native binaries for.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ github.event_name == 'push' || inputs.publish_only != 'true' }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Pinned explicitly so the release target always matches this
          # workflow's `push: branches: [main]` trigger, instead of relying
          # implicitly on the repository's default-branch setting.
          target-branch: main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - run: pnpm build
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      # `--no-git-checks` saute les vérifications de branche et de propreté que
      # pnpm fait avant publication : release-please a déjà taggé, et l'arbre est
      # celui du tag.
      - run: pnpm publish --no-git-checks --provenance
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
