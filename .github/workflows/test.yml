name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Garde-fou : essaim (public) ne ship que du générique. Aucun artefact ni
  # aucune mention "mekova" ne doit réapparaître — ces contenus vivent dans le
  # catalogue privé, pas ici. Ce job échoue toute PR qui les réintroduirait.
  no-domain-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuser les fichiers mekova
        run: |
          hits=$(git ls-files 'templates/mekova-*' 'presets/mekova-*' 'behaviors/mekova-*' 'compositions/mekova-*')
          if [ -n "$hits" ]; then
            echo "::error::Fichiers spécifiques mekova réintroduits :"; echo "$hits"; exit 1
          fi
      - name: Refuser toute mention "mekova"
        run: |
          if git grep -In -i 'mekova' -- . ':!.github/workflows/test.yml' > /tmp/hits 2>/dev/null; then
            echo "::error::Le terme 'mekova' est réapparu dans des fichiers suivis :"; cat /tmp/hits; exit 1
          fi
          echo "OK — aucune trace mekova."

  # Windows est à la fois la plateforme de développement de ce dépôt et une
  # cible livrée (release-binaries.yml publie essaim-<version>-win32-x64.tar.gz),
  # et pourtant rien ne l'exerçait ici : les deux jobs étaient sur ubuntu-latest.
  # C'est ce trou qui a laissé passer le résolveur de plateforme de
  # cli/self-update.ts, qui servait l'artefact Linux aux utilisateurs Windows.
  test:
    strategy:
      # Même raison que dans release-binaries.yml : sans ceci, l'échec d'UNE
      # jambe annule l'autre, et on perd l'information qui compte — la
      # régression est-elle globale ou spécifique à Windows ?
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build
