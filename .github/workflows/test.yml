name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Garde-fou : essaim (public) ne ship que du générique. Aucun artefact ni
  # aucune mention "mekova" ne doit réapparaître — ces contenus vivent dans le
  # catalogue privé, pas ici. Ce job échoue toute PR qui les réintroduirait.
  no-domain-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuser les fichiers mekova
        run: |
          hits=$(git ls-files 'templates/mekova-*' 'presets/mekova-*' 'behaviors/mekova-*' 'compositions/mekova-*')
          if [ -n "$hits" ]; then
            echo "::error::Fichiers spécifiques mekova réintroduits :"; echo "$hits"; exit 1
          fi
      - name: Refuser toute mention "mekova"
        run: |
          if git grep -In -i 'mekova' -- . ':!.github/workflows/test.yml' > /tmp/hits 2>/dev/null; then
            echo "::error::Le terme 'mekova' est réapparu dans des fichiers suivis :"; cat /tmp/hits; exit 1
          fi
          echo "OK — aucune trace mekova."

      # Même patron que l'étape précédente : un git grep sur des jetons morts et
      # vérifiables, avec exclusion des fichiers qui ont une raison légitime de les
      # contenir. `essaim bce`, `--preset` et `mcp-coordinator run` n'existent dans
      # aucune des huit commandes enregistrées par cli/index.ts. Les laisser dans la
      # doc publique, c'est offrir au premier visiteur une commande qui échoue
      # immédiatement (commander 14 refuse une option inconnue et un argument en trop).
      # CHANGELOG.md est exclu : il documente légitimement la suppression passée de
      # `essaim bce`. docs/superpowers/plans/2026-08-27-stabilite-essaim.md est exclu
      # pour la même raison : c'est le plan de CETTE tâche, versionné, qui cite ces
      # jetons morts comme des défauts à corriger. Ce workflow s'exclut lui-même,
      # comme l'étape précédente.
      #
      # Trois jetons figés : ça ne rattrape que LEUR régression, pas la prochaine
      # commande morte. Une vérification contre les commandes réellement
      # enregistrées par cli/index.ts serait plus juste mais n'est pas un simple
      # remplacement ici : deux des trois jetons ne sont pas des sous-commandes
      # essaim (`--preset` est une option, `mcp-coordinator run` appartient à un
      # AUTRE binaire), donc une liste de sous-commandes essaim ne les couvrirait
      # pas ; et une extraction générique de « essaim <mot> » dans la prose de
      # README.md tombe sur des faux positifs (« point essaim at it instead »,
      # « essaim itself ») qui coûteraient plus de bruit CI que ce que le garde-fou
      # rapporte. `--preset` en sous-chaîne nue matchait aussi n'importe quel futur
      # `--preset-xxx` légitime : resserré ci-dessous à une frontière de mot (pas
      # suivi d'un caractère alphanumérique ou d'un tiret), sans toucher aux deux
      # autres jetons ni à la portée du garde-fou.
      - name: Refuser les commandes CLI inexistantes dans la doc
        run: |
          if git grep -In -E -e 'essaim bce' -e '(--preset)([^A-Za-z0-9_-]|$)' -e 'mcp-coordinator run' -- . ':!CHANGELOG.md' ':!docs/superpowers/plans/2026-08-27-stabilite-essaim.md' ':!.github/workflows/test.yml' > /tmp/dead-cli 2>/dev/null; then
            echo "::error::Commandes CLI inexistantes dans la doc :"; cat /tmp/dead-cli; exit 1
          fi
          echo "OK — aucune commande CLI morte."

  # Windows est la plateforme de développement de ce dépôt et une cible npm
  # supportée, et pourtant rien ne l'exerçait ici : les deux jobs étaient sur
  # ubuntu-latest. On teste donc la matrice ubuntu + windows.
  test:
    strategy:
      # Sans ceci, l'échec d'UNE jambe annule l'autre, et on perd l'information
      # qui compte — la régression est-elle globale ou spécifique à Windows ?
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      # La jambe qui VERIFIE s'installe comme la publication npm, sinon un vert
      # ici ne dit plus rien de la release. `pnpm.onlyBuiltDependencies` (package.json) est une
      # autorisation permanente de compiler `better-sqlite3` — transitif via
      # mcp-coordinator — et c'est cette compilation qui a fait tomber la 0.12.0
      # sur Windows, faute de Visual Studio. Elle est inoffensive AUJOURD'HUI
      # (13.0.3 n'a aucun script install/postinstall et embarque
      # prebuilds/win32-x64.node), donc le drapeau ne coute rien ; il ferme la
      # porte le jour ou une montee de version rouvre ce chemin. Sans risque
      # verifie : aucun test ne charge la liaison native — importer
      # mcp-coordinator ne la touche pas, orchestrator-run.test.ts la mocke via
      # vi.mock et types.test.ts est en `import type`.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test

      - run: pnpm build

  # DF2 (généralité) — essaim doit marcher sur un dépôt qui n'est PAS essaim,
  # dans un langage qui n'est PAS TypeScript, lancé depuis un cwd externe. Ce
  # job échouait avant les chantiers 11-14 (#156 scope paramétrique, #157
  # isTestFile par langage, #158 runs/reports ancrés sur -p, #160 tsc TS-only).
  third-party:
    name: Dépôt tiers (Python), cwd externe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: scan + run --dry-run sur un dépôt Python jetable, depuis un cwd externe
        run: |
          set -euo pipefail
          # dépôt Python jetable (marqueur pyproject.toml pour la détection)
          REPO="$(mktemp -d)"
          git init -q "$REPO"
          printf '[project]\nname = "calc"\nversion = "0.1.0"\n' > "$REPO/pyproject.toml"
          mkdir -p "$REPO/src"
          printf 'def add(a, b):\n    return a + b\n' > "$REPO/src/calc.py"
          printf 'def test_add():\n    assert True\n' > "$REPO/src/calc_test.py"
          git -C "$REPO" add .
          git -C "$REPO" -c user.email=ci@ci -c user.name=ci commit -qm init
          # cwd EXTERNE : ni le dépôt cible, ni essaim
          CWD="$(mktemp -d)"; cd "$CWD"
          ESSAIM="$GITHUB_WORKSPACE/dist/cli/index.js"
          # le scanner détecte Python (pas de langage figé)
          node "$ESSAIM" scan "$REPO" > /tmp/scan.out
          grep -qi python /tmp/scan.out
          # dry-run raid : assemble prompts + plan sans lancer d'agent ni coordinator
          ESSAIM_SKIP_DOCTOR=1 node "$ESSAIM" run raid -p "$REPO" --dry-run
          # DF2 : AUCUN dossier créé dans le cwd externe (#158)
          if [ -n "$(ls -A "$CWD")" ]; then echo "::error::cwd sali: $(ls -A "$CWD")"; exit 1; fi
